<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Voice Test</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 40px; text-align: center; max-width: 700px; margin: 0 auto; }
    button {
      font-size: 18px;
      padding: 15px 30px;
      border-radius: 10px;
      background: #E85D4C;
      color: white;
      border: none;
      cursor: pointer;
      margin: 10px;
    }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .box {
      margin-top: 20px;
      font-size: 18px;
      min-height: 60px;
      border: 1px solid #ccc;
      padding: 20px;
      border-radius: 10px;
      text-align: left;
    }
    .label { font-weight: bold; color: #E85D4C; }
    .hint { color: #888; font-size: 14px; margin-top: 20px; }
  </style>
</head>
<body>

  <h1>Vasooli Voice Test</h1>
  <p>Simulating a collections call for: <b>Singh Enterprises</b>, ₹70,000 overdue, 60 days</p>
  <p class="hint">Use headphones for best results.</p>

  <button id="startBtn">🎤 Speak (as the debtor)</button>

  <div class="box">
    <div class="label">You said:</div>
    <div id="userText">-</div>
  </div>

  <div class="box">
    <div class="label">AI Agent replies:</div>
    <div id="aiText">-</div>
  </div>

  <script>
    const startBtn = document.getElementById("startBtn");
    const userTextDiv = document.getElementById("userText");
    const aiTextDiv = document.getElementById("aiText");

    const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;

    // Hard guard: only one request can be "in flight" at a time
    let isProcessing = false;

    if (!SpeechRecognitionCtor) {
      userTextDiv.innerText = "Speech recognition not supported. Use Chrome.";
    } else {

      function runOneListenCycle() {
        if (isProcessing) {
          console.log("DEBUG: blocked re-entrant call, already processing");
          return;
        }
        isProcessing = true;
        startBtn.disabled = true;
        userTextDiv.innerText = "Listening...";
        aiTextDiv.innerText = "-";

        // Create a BRAND NEW recognition object every single time
        const recognition = new SpeechRecognitionCtor();
        recognition.lang = "en-IN";
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        let resultHandled = false;

        recognition.onresult = async (event) => {
          if (resultHandled) {
            console.log("DEBUG: duplicate onresult ignored");
            return;
          }
          resultHandled = true;

          const spokenText = event.results[0][0].transcript;
          userTextDiv.innerText = spokenText;
          aiTextDiv.innerText = "Thinking...";

          try {
            const response = await fetch("/api/converse", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                debtor_message: spokenText,
                business_name: "Singh Enterprises",
                amount: 70000,
                days_overdue: 60
              })
            });
            const data = await response.json();
            console.log("DEBUG converse response:", JSON.stringify(data));
            aiTextDiv.innerText = data.reply;

                        const utterance = new SpeechSynthesisUtterance(data.reply);
            utterance.lang = "en-IN";

            // Try to pick a male-sounding voice if available
            const voices = speechSynthesis.getVoices();
            const maleVoice = voices.find(v => v.lang.includes("en") && /male/i.test(v.name)) ||
                               voices.find(v => v.name.includes("Google UK English Male")) ||
                               voices.find(v => v.name.includes("Microsoft David")) ||
                               voices.find(v => v.lang.includes("en-IN"));
            if (maleVoice) {
              utterance.voice = maleVoice;
            }
            utterance.onend = () => {
              isProcessing = false;
              startBtn.disabled = false;
            };
            utterance.onerror = () => {
              isProcessing = false;
              startBtn.disabled = false;
            };
            speechSynthesis.speak(utterance);

          } catch (error) {
            console.log("DEBUG converse catch error:", error.message);
            aiTextDiv.innerText = "Error getting AI response.";
            isProcessing = false;
            startBtn.disabled = false;
          }
        };

        recognition.onerror = (event) => {
          userTextDiv.innerText = "Error: " + event.error;
          isProcessing = false;
          startBtn.disabled = false;
        };

        recognition.onend = () => {
          // If recognition ended without ever getting a result, release the lock
          if (!resultHandled) {
            isProcessing = false;
            startBtn.disabled = false;
          }
        };

        recognition.start();
      }

      startBtn.addEventListener("click", runOneListenCycle);
    }
  </script>

</body>
</html>
